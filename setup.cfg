[metadata]
name = mia-your-girlfriend
version = 2.0.0
description = A chat-style terminal romance with a polished interactive TUI and a one-way season finale.
long_description = file: README.md
long_description_content_type = text/markdown
requires-python = >=3.10

[options]
packages =
    mia_your_girlfriend
    mia_your_girlfriend.tui
package_dir =
    = .
include_package_data = True
zip_safe = False

[options.entry_points]
console_scripts =
    mia = mia_your_girlfriend:main

[options.package_data]
mia_your_girlfriend =
    mia_portrait.ans
    mia_girl.txt
